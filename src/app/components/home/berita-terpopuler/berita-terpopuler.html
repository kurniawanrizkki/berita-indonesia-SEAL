<div class="px-4 sm:px-6 lg:px-15 pt-10">
  <div class="flex items-center gap-3 mb-6">
      <div class="w-1 h-6 bg-[#0090FF] rounded"></div>
      <h2 class="text-lg font-semibold text-gray-900">
        Berita Terpopuler
      </h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 lg:gap-4">
      <div *ngIf="topNews$ | async as topNews" class="news-item relative p-4 bg-white rounded-lg lg:bg-transparent lg:rounded-none">
        <div class="flex gap-3 relative">
          <div class="text-white bg-[#1F2B39] absolute top-[-10px] left-[-10px] rounded-full w-8 h-8 flex justify-center items-center text-sm">
          1
          </div>
          <img src="./assets/img/headline.png"
               alt="News thumbnail"
               class="rounded-md w-24 h-24 sm:w-28 sm:h-28 lg:w-30 lg:h-30 object-cover flex-shrink-0" />
          <div class="flex-1 min-w-0">
            <p class="text-sm text-gray-900 line-clamp-3 mb-3">
            {{ topNews.title }}
            </p>
            <div class="flex items-center gap-2 flex-wrap">
              <a href="#" class="text-[#0090FF] text-xs sm:text-sm hover:underline">Politik</a>
              <span class="w-1 h-1 bg-gray-400 rounded-full"></span>
              <span class="text-gray-400 text-xs sm:text-sm">22 Jan 2024</span>
            </div>
          </div>
      <div class="w-0.5 h-30 bg-gray-300 rounded"></div>
        </div>
      </div>

  </div>
